name: Verify research workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run data:validate
      - run: npm run evaluation:run
      - run: npm run evidence:report
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - run: npm run test:hosted
