services:
  - type: web
    name: aletheia-recon
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && npm run data:validate && npm run evaluation:run && npm run evidence:report
    startCommand: npm run start:hosted
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: RECON_DATA_DIR
        value: /tmp/recon
      - key: RECON_STORAGE_MODE
        value: temporary
      - key: RECON_LIVE_TAXONOMY
        value: "1"
